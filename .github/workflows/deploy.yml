name: Deploy (GitHub Pages + Supabase Edge Functions)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  supabase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase secrets
        id: secrets
        shell: bash
        run: |
          if [[ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" && -n "${{ secrets.SUPABASE_PROJECT_REF }}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase 배포 시크릿이 없어 Edge Function 배포를 건너뜁니다."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.115.0

      - name: Enable one-time report benchmark
        if: steps.secrets.outputs.ready == 'true'
        id: benchmark
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          supabase secrets set REPORT_BENCHMARK_TOKEN="$TOKEN" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy Edge Function
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Benchmark daily report passes
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          BENCHMARK_TOKEN: ${{ steps.benchmark.outputs.token }}
        run: |
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-benchmark-token: ${BENCHMARK_TOKEN}" \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api/admin/report-benchmark")"
          echo "REPORT_BENCHMARK_RESULT=$RESPONSE"

      - name: Disable one-time report benchmark
        if: always() && steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase secrets unset REPORT_BENCHMARK_TOKEN --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
