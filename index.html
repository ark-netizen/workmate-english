<!doctype html>
<html lang="ko" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon-mark.png" type="image/png" />
    <link rel="alternate icon" href="/favicon.ico" sizes="256x256" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- CSS에서 font-family로 "Pretendard"를 지정하고 있었지만 정작 폰트 파일을 불러오는
         코드가 없어서 실제로는 한 번도 적용되지 않고 계속 시스템 기본 폰트로 대체되고 있었음
         (기기마다 다르게 보이고 굵기도 불안정했던 원인) — 실제로 로드되도록 추가 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <title>부캐영어 · WorkMate English</title>
    <meta name="description" content="몰입형 오피스 영어 학습, 부캐영어(WorkMate English)" />

    <!-- Open Graph / 카카오톡·페이스북 등 링크 공유 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="부캐영어 · WorkMate English" />
    <meta property="og:title" content="부캐영어 · WorkMate English" />
    <meta property="og:description" content="영어를 공부하지 마세요, 영어로 일하는 하루를 경험하세요. 동료·상사·거래처와 매일 다른 톤으로 대화하며 몸으로 익히는 비즈니스 영어." />
    <meta property="og:url" content="https://www.enmate.co.kr/" />
    <meta property="og:image" content="https://www.enmate.co.kr/brand/og-image-v3.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- 트위터/X 카드 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="부캐영어 · WorkMate English" />
    <meta name="twitter:description" content="영어를 공부하지 마세요, 영어로 일하는 하루를 경험하세요." />
    <meta name="twitter:image" content="https://www.enmate.co.kr/brand/og-image-v3.png" />

    <!-- 게임모드 인트로: TODAY'S QUEST 카드와 수달을 기존 레이아웃을 깨지 않는 범위에서 확대 -->
    <style>
      @media (min-width: 901px) {
        .intro-page.intro-game .hero .wrap {
          max-width: 1380px !important;
          grid-template-columns: minmax(0, .76fr) minmax(0, 1.24fr) !important;
          gap: 54px !important;
        }
        .intro-page.intro-game .hero .preview {
          width: 100% !important;
        }
      }
      .intro-page.intro-game .hero .mailhead {
        padding: 15px 18px !important;
      }
      .intro-page.intro-game .hero .person {
        min-height: 100px !important;
        padding: 15px 5px !important;
        gap: 16px !important;
      }
      .intro-page.intro-game .hero .person strong {
        font-size: 15px !important;
      }
      .intro-page.intro-game .hero .person small {
        margin-top: 6px !important;
        font-size: 14px !important;
      }
      .intro-page.intro-game .hero .tone {
        padding: 6px 9px !important;
        font-size: 12px !important;
      }
      .intro-page.intro-game .hero .avatar {
        width: 72px !important;
        height: 82px !important;
        flex: 0 0 72px !important;
        padding: 2px !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
      }
      .intro-page.intro-game .hero .avatar > [role="img"] {
        width: 100% !important;
        height: 100% !important;
        border-radius: 0 !important;
        background: transparent !important;
        overflow: hidden !important;
      }
      .intro-page.intro-game .hero .avatar > [role="img"] > img {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain !important;
        transform: none !important;
      }
      @media (max-width: 900px) and (min-width: 561px) {
        .intro-page.intro-game .hero .avatar {
          width: 66px !important;
          height: 76px !important;
          flex-basis: 66px !important;
        }
        .intro-page.intro-game .hero .person {
          min-height: 92px !important;
        }
      }
      @media (max-width: 560px) {
        .intro-page.intro-game .hero .avatar {
          width: 58px !important;
          height: 66px !important;
          flex-basis: 58px !important;
        }
        .intro-page.intro-game .hero .person {
          min-height: 82px !important;
        }
      }
    </style>

    <script>
      // 404.html이 인코딩해서 보낸 원래 경로를 복원 — react-router가 초기화되기 전에 실행돼야 함
      (function () {
        var redirect = new URLSearchParams(window.location.search).get("p");
        if (redirect) window.history.replaceState(null, "", redirect);
      })();
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
